[tool.poetry]
name = "gfmodules-prs-saml"
version = "0.1.0"
description = "SAML receiver (SAML-ontvanger) for the Pseudoniemendienst"
license = "EUPL-1.2"
authors = ["Ministerie van Volksgezondheid, Welzijn en Sport"]
repository = "https://github.com/minvws/gfmodules-prs-saml"
readme = "README.md"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.11"
uvicorn = ">=0.40,<0.53"
fastapi = ">=0.136.3,<0.142.0"
pydantic = "^2.12.5"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.19.1,<3.0.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
ruff = ">=0.15.1,<0.17.0"
codespell = "^2.2.6"
httpx2 = "^2.5.0"
pip-audit = "^2.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
cache-dir = "~/.cache/ruff"
include = [
    "pyproject.toml",
    "app/*.py",
    "tests/*.py",
]

[tool.mypy]
files = "app,tests"
python_version = "3.11"
strict = true
cache_dir = "~/.cache/mypy"
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
testpaths = [
    "tests",
]
